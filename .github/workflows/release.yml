name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Dependencies and tests run here without the OIDC permission; publish only receives the packed artifacts.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install browser package dependencies
        run: npm ci --prefix packages/darkws

      - name: Validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
              throw "Release tag must be SemVer prefixed with v: $env:RELEASE_TAG"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/check-version.ps1 -ExpectedVersion $version
          if (-not (Select-String -LiteralPath CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) {
              throw "CHANGELOG.md must contain a release entry for $version"
          }
          $isPrerelease = $version.Contains('-')
          if ($isPrerelease -ne [bool]::Parse($env:GITHUB_PRERELEASE)) {
              throw "GitHub prerelease flag does not match version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "npm_tag=$(if ($isPrerelease) { 'next' } else { 'latest' })" >> $env:GITHUB_OUTPUT

      # The gate packs, inspects, and installs the packages; exactly those files are published.
      - name: Run tests and coverage gates
        shell: pwsh
        env:
          DARKWS_PACKAGE_OUTPUT: ${{ github.workspace }}/artifacts
        run: ./scripts/test-coverage.ps1

      - name: Upload verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Authenticate to NuGet.org
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
              dotnet nuget push $_.FullName `
                  --api-key $env:NUGET_API_KEY `
                  --source https://api.nuget.org/v3/index.json `
                  --skip-duplicate
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish npm package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
        run: |
          $published = npm view "darkws@$env:PACKAGE_VERSION" version 2>$null
          if ($LASTEXITCODE -eq 0 -and $published.Trim() -eq $env:PACKAGE_VERSION) {
              Write-Host "darkws@$env:PACKAGE_VERSION is already published"
              exit 0
          }
          # Publishing the verified tarball runs no package scripts and rebuilds nothing.
          npm publish "artifacts/darkws-$env:PACKAGE_VERSION.tgz" --tag $env:NPM_TAG

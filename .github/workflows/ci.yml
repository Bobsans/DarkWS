name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/darkws/package-lock.json

      - name: Install browser package dependencies
        run: npm ci --prefix packages/darkws

      - name: Verify package versions
        shell: pwsh
        run: ./scripts/test-version.ps1

      - name: Run tests and coverage gates
        shell: pwsh
        env:
          DARKWS_PACKAGE_OUTPUT: ${{ runner.temp }}/darkws-packages
        run: ./scripts/test-coverage.ps1

      - name: Save verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: ${{ runner.temp }}/darkws-packages/*
          if-no-files-found: error

  redis-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        redis: ['2.13.17', '3.2.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Test Redis dependency compatibility
        run: dotnet test DarkWS.Redis.Test/DarkWS.Redis.Test.csproj -p:StackExchangeRedisVersion=${{ matrix.redis }}
